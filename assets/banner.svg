<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="FruitFlyMotor">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#101a2c"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#37d399"/>
    </marker>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="60" y="96" fill="#e8eefc" font-size="52" font-weight="bold">FruitFlyMotor</text>
    <text x="60" y="140" fill="#8fa3c8" font-size="24">commands out, telemetry back, silence stops</text>
    <text x="60" y="182" fill="#5f7099" font-size="17">clamp · dead zone · slew · smoothing · invert · watchdog</text>
  </g>
  <g stroke="#2f4a6b" stroke-width="1.5" fill="none">
    <rect x="60" y="212" width="140" height="52" rx="8" fill="#141f36"/>
    <rect x="262" y="212" width="140" height="52" rx="8" fill="#141f36"/>
    <rect x="464" y="212" width="176" height="52" rx="8" fill="#141f36"/>
    <rect x="702" y="212" width="140" height="52" rx="8" fill="#141f36"/>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#c8d6f0">
    <text x="92" y="244">drives 0..1</text>
    <text x="306" y="244">shaper</text>
    <text x="492" y="244">UDP :9000</text>
    <text x="744" y="244">robot</text>
  </g>
  <g stroke="#37d399" stroke-width="2" marker-end="url(#a)">
    <line x1="204" y1="238" x2="256" y2="238"/>
    <line x1="406" y1="238" x2="458" y2="238"/>
    <line x1="644" y1="238" x2="696" y2="238"/>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#8fa3c8">
    <text x="880" y="226">telemetry → watchdog</text>
    <text x="880" y="248">silence → zero</text>
    <text x="880" y="270">replay ← session.jsonl</text>
  </g>
</svg>
